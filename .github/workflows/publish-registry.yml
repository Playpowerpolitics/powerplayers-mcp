# Republish server.json to the official MCP Registry whenever it changes on main (BATCH-1142B, POW-577).
# GitHub OIDC proves this repo owns the io.github.Playpowerpolitics namespace, so no secret is needed.
name: Publish to MCP Registry
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
